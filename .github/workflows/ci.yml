name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # binlog 测试需要 mysqld 启动参数（service options 不支持传参），用普通步骤起容器
      - name: Start MySQL with binlog
        run: |
          docker run -d --name cache-kit-mysql -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=cachekit_test \
            mysql:8.4 --log-bin=mysql-bin --binlog-format=ROW --server-id=1
          timeout 120 bash -c 'until docker exec cache-kit-mysql mysql -uroot -proot -e "USE cachekit_test; SELECT 1" >/dev/null 2>&1; do sleep 3; done'
          docker exec cache-kit-mysql mysql -uroot -proot -e "SELECT @@log_bin, @@binlog_format"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build & Test (with real Redis service)
        run: mvn -B test --file pom.xml
      - name: Install to local repo (verify packaging)
        run: mvn -B install -DskipTests -Dgpg.skip=true --file pom.xml

  # Boot 4 前向兼容验证：4.0.0 依赖树下跑非集成全量（装配/切面/指标/binlog 生命周期等 111 例）。
  # Boot 4 变化：spring-boot-starter-aop 被 spring-boot-starter-aspectj 取代；
  # data.redis/jdbc autoconfigure 挪包（类名 Redis→DataRedis）——测试经 BootAutoconfigCompat 反射双 FQN。
  boot4-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch to Spring Boot 4.0.0
        run: |
          sed -i 's|<version>3.5.14</version>|<version>4.0.0</version>|' pom.xml
          sed -i 's|<artifactId>spring-boot-starter-aop</artifactId>|<artifactId>spring-boot-starter-aspectj</artifactId>|' pom.xml
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Test (Boot 4, non-container suite)
        run: mvn -B -ntp test --file pom.xml "-Dtest=!*IntegrationTest"
