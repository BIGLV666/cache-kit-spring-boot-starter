name: Publish to Maven Central

# 打 v* 标签触发发布，例如: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # binlog 测试需要 mysqld 启动参数（service options 不支持传参），用普通步骤起容器
      - name: Start MySQL with binlog
        run: |
          docker run -d --name cache-kit-mysql -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=cachekit_test \
            mysql:8.4 --log-bin=mysql-bin --binlog-format=ROW --server-id=1
          timeout 120 bash -c 'until docker exec cache-kit-mysql mysql -uroot -proot -e "USE cachekit_test; SELECT 1" >/dev/null 2>&1; do sleep 3; done'
          docker exec cache-kit-mysql mysql -uroot -proot -e "SELECT @@log_bin, @@binlog_format"

      - name: Set up JDK 17 and import GPG key
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Configure Maven Central credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Test, sign and publish
        run: mvn -B -ntp verify deploy -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}
